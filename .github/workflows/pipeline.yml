name: Salesforce CI/CD

on:
  pull_request:
    branches: [develop, sit, uat, main]
    paths:
      - "force-app/**"
      - "sfdx-project.json"
  push:
    branches: [develop, sit, uat, main]
    paths:
      - "force-app/**"
      - "sfdx-project.json"
  workflow_dispatch:

concurrency:
  group: sf-deploy-${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment: ${{ (github.event_name == 'pull_request' && github.base_ref || github.ref_name) == 'main' && 'Production' || (github.event_name == 'pull_request' && github.base_ref || github.ref_name) == 'uat' && 'UAT' || (github.event_name == 'pull_request' && github.base_ref || github.ref_name) == 'sit' && 'SIT' || 'Dev' }}

    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
      CHECK_ONLY: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Select auth URL for target org
        id: pick
        env:
          AUTH_DEV: ${{ secrets.DEV }}
          AUTH_SIT: ${{ secrets.SIT }}
          AUTH_UAT: ${{ secrets.UAT }}
          AUTH_PROD: ${{ secrets.PROD }}
        run: |
          case "$TARGET_BRANCH" in
            main)    echo "$AUTH_PROD" > ./authurl.txt; echo "test_level=RunLocalTests" >> "$GITHUB_OUTPUT" ;;
            uat)     echo "$AUTH_UAT"  > ./authurl.txt; echo "test_level=RunLocalTests" >> "$GITHUB_OUTPUT" ;;
            sit)     echo "$AUTH_SIT"  > ./authurl.txt; echo "test_level=RunLocalTests" >> "$GITHUB_OUTPUT" ;;
            develop) echo "$AUTH_DEV"  > ./authurl.txt; echo "test_level=NoTestRun"     >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported branch: $TARGET_BRANCH"; exit 1 ;;
          esac

      - name: Authenticate to org
        run: |
          sf org login sfdx-url --sfdx-url-file ./authurl.txt --alias target-org --set-default
          rm -f ./authurl.txt

      - name: Validate (pull request, check-only)
        if: env.CHECK_ONLY == 'true'
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --target-org target-org \
            --test-level ${{ steps.pick.outputs.test_level }} \
            --wait 60

      - name: Deploy (push)
        if: env.CHECK_ONLY != 'true'
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org target-org \
            --test-level ${{ steps.pick.outputs.test_level }} \
            --wait 60

      - name: Logout
        if: always()
        run: |
          sf org logout --target-org target-org --no-prompt || true
          rm -f ./authurl.txt